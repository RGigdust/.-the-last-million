<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>body { margin: 0; background: #000; overflow: hidden; font-family: Arial, sans-serif; }</style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            physics: { default: 'arcade', arcade: { debug: false } },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let player, enemy, target, coins, scoreText;
        let score = 0;

        function preload() {
            this.load.image('grass', 'https://labs.phaser.io/assets/textures/grass.png');
            this.load.image('lion', 'https://labs.phaser.io/assets/sprites/beast.png');
            this.load.image('building', 'https://labs.phaser.io/assets/sprites/fuji.png');
            this.load.image('coin', 'https://labs.phaser.io/assets/sprites/apple.png');
            this.load.image('enemy', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
        }

        function create() {
            this.physics.world.setBounds(0, 0, 3000, 3000);
            this.add.tileSprite(1500, 1500, 3000, 3000, 'grass');

            // المقر الملكي
            this.add.image(1500, 1200, 'building').setScale(1);
            this.add.text(1500, 1050, '🏛️ المقر الملكي لـ $LAST', { fontSize: '32px', fill: '#ffd700' }).setOrigin(0.5);

            // الذهب
            coins = this.physics.add.group();
            for (let i = 0; i < 40; i++) {
                let x = Phaser.Math.Between(200, 2800);
                let y = Phaser.Math.Between(200, 2800);
                coins.create(x, y, 'coin').setScale(0.6).setTint(0xffd700);
            }

            // الأسد الملك
            player = this.physics.add.sprite(1500, 1500, 'lion').setScale(1.2);
            player.setCollideWorldBounds(true);
            this.cameras.main.startFollow(player, true, 0.08, 0.08);

            // --- العدو (الضبع) ---
            enemy = this.physics.add.sprite(2000, 2000, 'enemy').setScale(1.5).setTint(0xff0000);
            enemy.setCollideWorldBounds(true);

            // ذكاء اصطناعي بسيط: العدو يطارد الأسد كل ثانيتين
            this.time.addEvent({
                delay: 2000,
                callback: () => {
                    this.physics.moveToObject(enemy, player, 160); // سرعة متوسطة للمطاردة
                },
                loop: true
            });

            // عداد الذهب
            scoreText = this.add.text(20, 20, 'Gold $LAST: 0', { 
                fontSize: '28px', fill: '#fff', backgroundColor: '#000000aa', padding: 10 
            }).setScrollFactor(0);

            // اصطدام الذهب
            this.physics.add.overlap(player, coins, (p, coin) => {
                coin.destroy();
                score += 10;
                scoreText.setText('Gold $LAST: ' + score);
            }, null, this);

            // --- اصطدام العدو (الخطر) ---
            this.physics.add.overlap(player, enemy, () => {
                score = Math.max(0, score - 20); // خسارة ذهب
                scoreText.setText('Gold $LAST: ' + score);
                player.setPosition(1500, 1500); // العودة للمركز
                target = null;
                this.cameras.main.shake(500, 0.02);
                alert("⚠️ هجوم! الضبع سرق منك 20 ذهبة!");
            }, null, this);

            this.input.on('pointerdown', (pointer) => {
                target = pointer.positionToCamera(this.cameras.main);
                this.physics.moveToObject(player, target, 300);
            });
        }

        function update() {
            if (target && player.body) {
                let dist = Phaser.Math.Distance.Between(player.x, player.y, target.x, target.y);
                if (dist < 10) { player.body.reset(player.x, player.y); target = null; }
                player.setFlipX(player.body.velocity.x < 0);
            }
            // لف وجه العدو ناحية الأسد
            enemy.setFlipX(enemy.body.velocity.x < 0);
        }
    </script>
</body>
</html>
