<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$LAST Empire - The Sovereign Jungle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #010a01; overflow: hidden; font-family: sans-serif; }
    </style>
</head>
<body>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

class FinalEmpire extends Phaser.Scene {
    constructor() { super('FinalEmpire'); }

    create() {
        const w = 3000, h = 3000;
        this.physics.world.setBounds(0, 0, w, h);

        // 1. أرضية الغابة والبيئة
        this.add.rectangle(w/2, h/2, w, h, 0x064e3b);
        for(let i=0; i<300; i++) this.add.text(Phaser.Math.Between(0, w), Phaser.Math.Between(0, h), '🌿', {alpha:0.2});

        // 2. شجرة الحكمة (نقطة التجمع)
        this.add.text(w/2, h/2, '🌳', {fontSize: '150px'}).setOrigin(0.5);
        this.add.text(w/2, h/2 + 80, 'عرين الأسود - نقطة التجمع', {backgroundColor:'#000', padding:5}).setOrigin(0.5);

        // 3. الأسد القائد
        this.player = this.add.container(w/2, h/2 + 200);
        let pIcon = this.add.text(0, 0, '🦁', {fontSize: '60px'}).setOrigin(0.5);
        let pName = this.add.text(0, 50, tg.initDataUnsafe.user?.first_name || "الأسد القائد", {fontSize: '16px', backgroundColor: '#000'}).setOrigin(0.5);
        this.player.add([pIcon, pName]);
        this.physics.add.existing(this.player);

        // 4. الكاميرا والبوصلة
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.cameras.main.setBounds(0, 0, w, h);
        this.compass = this.add.text(this.scale.width/2, 100, '⬆️ فريسة نادرة قريبة', {fill:'#0ff', backgroundColor:'#000'}).setOrigin(0.5).setScrollFactor(0).setVisible(false);

        // 5. الكنز (الفريسة)
        this.treasure = this.add.text(0, 0, '💎', {fontSize:'50px'}).setOrigin(0.5).setVisible(false);
        this.physics.add.existing(this.treasure);

        // 6. فلتر الليل والنهار (Market Filter)
        this.nightFilter = this.add.rectangle(w/2, h/2, w, h, 0x011627, 0).setDepth(1000).setScrollFactor(1);

        // التفاعلات
        this.time.addEvent({ delay: 30000, callback: this.spawnTreasure, loop: true });
        this.physics.add.overlap(this.player, this.treasure, this.collect, null, this);
        
        // محاكاة تقلب السوق (تجربة)
        this.time.addEvent({ delay: 15000, callback: () => {
            let isNight = this.nightFilter.alpha === 0;
            this.nightFilter.setAlpha(isNight ? 0.6 : 0);
            tg.HapticFeedback.impactOccurred('medium');
        }, loop: true });
    }

    spawnTreasure() {
        const x = Phaser.Math.Between(100, 2900);
        const y = Phaser.Math.Between(100, 2900);
        this.treasure.setPosition(x, y).setVisible(true);
        this.compass.setVisible(true);
    }

    collect() {
        this.treasure.setVisible(false);
        this.compass.setVisible(false);
        tg.showAlert("تم صيد الفريسة! +500 نقطة سيادة 🥩");
    }

    update() {
        if (this.input.activePointer.isDown) {
            let target = this.cameras.main.getWorldPoint(this.input.x, this.input.y);
            this.physics.moveToObject(this.player, target, 300);
            this.player.setScale(this.player.x < target.x ? 1 : -1, 1);
        } else {
            this.player.body.setVelocity(0);
        }

        if(this.treasure.visible) {
            let angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, this.treasure.x, this.treasure.y);
            this.compass.setRotation(angle + Math.PI/2);
        }
    }
}

const config = { type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight, scene: FinalEmpire, physics: { default: 'arcade' } };
new Phaser.Game(config);
</script>
</body>
</html>
