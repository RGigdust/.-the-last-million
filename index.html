
     َََََ<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>body { margin: 0; background: #000; overflow: hidden; font-family: Arial, sans-serif; }</style>
</head>
<body>
    <script>
        // --- 1. شاشة البداية ---
        class StartScene extends Phaser.Scene {
            constructor() { super({ key: 'StartScene' }); }
            preload() {
                this.load.image('lion_logo', 'https://labs.phaser.io/assets/sprites/beast.png');
            }
            create() {
                const { width, height } = this.scale;
                this.add.image(width/2, height/2 - 150, 'lion_logo').setScale(2);
                this.add.text(width/2, height/2, '$LAST: The Lion\'s Rise', { fontSize: '40px', fill: '#ffd700', fontWeight: 'bold' }).setOrigin(0.5);
                this.add.text(width/2, height/2 + 60, 'في مملكة $LAST.. أنت الملك، والمركزية هي الطريد', { fontSize: '18px', fill: '#fff', align: 'center', wordWrap: { width: width - 40 } }).setOrigin(0.5);
                
                let btn = this.add.text(width/2, height/2 + 150, '👉 ابدأ الرحلة 👈', { fontSize: '28px', fill: '#0f0', backgroundColor: '#222', padding: 10 }).setOrigin(0.5).setInteractive();
                btn.on('pointerdown', () => this.scene.start('GameScene'));
            }
        }

        // --- 2. مشهد اللعبة الأساسي ---
        class GameScene extends Phaser.Scene {
            constructor() { super({ key: 'GameScene' }); }
            
            preload() {
                this.load.image('grass', 'https://labs.phaser.io/assets/textures/grass.png');
                this.load.image('lion', 'https://labs.phaser.io/assets/sprites/beast.png');
                this.load.image('coin', 'https://labs.phaser.io/assets/sprites/apple.png');
                this.load.image('hunter', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
                this.load.image('prey', 'https://labs.phaser.io/assets/sprites/carrot.png');
            }

            create() {
                this.physics.world.setBounds(0, 0, 3000, 3000);
                this.add.tileSprite(1500, 1500, 3000, 3000, 'grass');
                
                this.player = this.physics.add.sprite(1500, 1500, 'lion').setScale(0.8);
                this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
                this.hunter = this.physics.add.sprite(2000, 2000, 'hunter').setScale(1.5).setTint(0x333333);
                
                this.coins = this.physics.add.group();
                this.preys = this.physics.add.group();
                for(let i=0; i<30; i++) this.coins.create(Phaser.Math.Between(100,2900), Phaser.Math.Between(100,2900), 'coin').setTint(0xffd700);

                // نظام المهمات
                this.quests = { gold: false, grow: false, defeat: false };
                this.questUI = this.add.text(20, 70, '', { fontSize: '16px', fill: '#0f0', backgroundColor: '#00000088', padding: 5 }).setScrollFactor(0);
                this.updateQuestUI();

                this.score = 0;
                this.scoreText = this.add.text(20, 20, 'Gold: 0', { fontSize: '24px', fill: '#fff' }).setScrollFactor(0);

                // التفاعلات
                this.physics.add.overlap(this.player, this.coins, (p, c) => {
                    c.destroy(); this.score += 10; this.scoreText.setText('Gold: ' + this.score);
                    if(this.score >= 100) this.quests.gold = true; this.updateQuestUI();
                });

                this.physics.add.overlap(this.player, this.preys, (p, pr) => {
                    pr.destroy(); this.player.setScale(this.player.scale + 0.2);
                    if(this.player.scale > 1.3) this.quests.grow = true; this.updateQuestUI();
                });

                this.physics.add.overlap(this.player, this.hunter, () => {
                    if(this.player.scale > 1.3) {
                        this.hunter.destroy(); this.quests.defeat = true; this.updateQuestUI();
                        this.add.text(this.player.x, this.player.y - 50, 'النصر!', { fontSize: '30px', fill: '#f00' });
                    }
                });

                this.time.addEvent({ delay: 5000, callback: () => this.preys.create(Phaser.Math.Between(100,2900), Phaser.Math.Between(100,2900), 'prey'), loop: true });
                this.input.on('pointerdown', (p) => { this.target = p.positionToCamera(this.cameras.main); this.physics.moveToObject(this.player, this.target, 300); });
            }

            updateQuestUI() {
                let txt = `قائمة المهمات:\n`;
                txt += `${this.quests.gold ? '✅' : '⬜'} اجمع 100 ذهبة\n`;
                txt += `${this.quests.grow ? '✅' : '⬜'} كن أسداً كبيراً (أكل الفريسة)\n`;
                txt += `${this.quests.defeat ? '✅' : '⬜'} اطرد النظام المركزي (الصياد)`;
                this.questUI.setText(txt);
            }

            update() {
                if(this.target && Phaser.Math.Distance.Between(this.player.x, this.player.y, this.target.x, this.target.y) < 10) this.player.body.reset(this.player.x, this.player.y);
                if(this.hunter && this.hunter.active) this.physics.moveToObject(this.hunter, this.player, 150);
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            physics: { default: 'arcade' },
            scene: [StartScene, GameScene]
        };
        new Phaser.Game(config);
    </script>
</body>
</html>
