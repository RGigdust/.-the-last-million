<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$LAST Empire - Future Academy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
    </style>
</head>
<body>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

class GameScene extends Phaser.Scene {
    constructor() {
        super('GameScene');
        this.score = 150; // رصيد ذهب تجريبي
    }

    preload() {
        // هنا بنحمل الصور (استخدم روابط مؤقتة)
        this.load.image('lion', 'https://labs.phaser.io/assets/sprites/behold.png');
    }

    create() {
        const { width, height } = this.scale;

        // 1. الأسد (القائد)
        this.player = this.add.sprite(width / 2, height / 2, 'lion').setScale(0.5);
        this.add.text(width/2, height/2 + 60, "القائد الملكي", {fill: '#ffd700'}).setOrigin(0.5);

        // 2. شريط الأخبار العاجلة (News Ticker)
        this.createTicker();

        // 3. أزرار التحكم في الكيان (القائمة الجانبية)
        this.createAdminButtons();

        // 4. إنشاء الواجهات (تكون مخفية)
        this.createTradingUI();
        this.createShopUI();

        // رسالة ترحيب من تليجرام
        tg.showAlert("مرحباً بك في كيان $LAST الإمبراطوري");
    }

    createTicker() {
        const news = [
            "🔴 عاجل: عملة $LAST تستعد للإدراج", 
            "🌍 سعر TON الحلي: 5.40 USD", 
            "🎓 الأكاديمية: درس جديد في تحليل الشموع متاح الآن",
            "🔥 مجتمع الأسود يتجاوز 10,000 عضو"
        ];
        let bar = this.add.rectangle(this.scale.width/2, this.scale.height - 20, this.scale.width, 40, 0x000000, 0.9);
        this.tickerText = this.add.text(this.scale.width, this.scale.height - 30, news.join("    ●    "), {
            fontSize: '18px', fill: '#00ff00', fontWeight: 'bold'
        });
    }

    createAdminButtons() {
        const btnStyle = { backgroundColor: '#222', padding: 10, borderRadius: 5 };
        
        // زر البورصة
        this.add.text(20, 20, '📊 البورصة', {fill: '#0f0', ...btnStyle}).setInteractive()
            .on('pointerdown', () => this.toggleUI(this.tradingUI));

        // زر المتجر
        this.add.text(120, 20, '🛒 المتجر', {fill: '#ffd700', ...btnStyle}).setInteractive()
            .on('pointerdown', () => this.toggleUI(this.shopUI));

        // زر التواصل
        this.add.text(220, 20, '💬 التواصل', {fill: '#0af', ...btnStyle}).setInteractive()
            .on('pointerdown', () => tg.showAlert("جاري فتح ساحة النقاش الملكية..."));
    }

    createTradingUI() {
        const { width, height } = this.scale;
        this.tradingUI = this.add.container(width/2, height/2).setVisible(false).setDepth(10);
        
        let bg = this.add.rectangle(0, 0, width*0.9, height*0.7, 0x0a0a0a, 0.95).setStrokeStyle(2, 0x00ff00);
        let title = this.add.text(0, -height*0.3, "📊 منصة التداول الحية (Live)", {fontSize: '22px', fill: '#0f0'}).setOrigin(0.5);
        
        // رسم شارت بسيط (شموع وهمية)
        let chart = this.add.graphics();
        chart.lineStyle(2, 0x00ff00);
        for(let i=0; i<10; i++) {
            chart.strokeRect(-150 + (i*30), Math.random()*50, 15, Math.random()*-100);
        }
        
        let dataInfo = this.add.text(-width*0.4, 50, "Asset: TON/USD\nHigh: 5.60\nLow: 5.10\nVol: 1.2M", {lineSpacing: 10});
        
        let closeBtn = this.add.text(0, height*0.3, "[ إغلاق ]", {fill: '#f00'}).setInteractive().on('pointerdown', () => this.tradingUI.setVisible(false));
        
        this.tradingUI.add([bg, title, chart, dataInfo, closeBtn]);
    }

    createShopUI() {
        const { width, height } = this.scale;
        this.shopUI = this.add.container(width/2, height/2).setVisible(false).setDepth(10);
        
        let bg = this.add.rectangle(0, 0, width*0.8, height*0.6, 0x111, 0.95).setStrokeStyle(2, 0xffd700);
        let title = this.add.text(0, -height*0.25, "🏛️ متجر الأصول الرقمية", {fontSize: '22px', fill: '#ffd700'}).setOrigin(0.5);
        
        let item1 = this.add.text(0, -50, "✨ هالة النجوم (50 Stars)", {backgroundColor: '#333', padding: 10}).setOrigin(0.5).setInteractive()
            .on('pointerdown', () => tg.showAlert("سيتم فتح فاتورة نجوم تليجرام..."));
            
        let item2 = this.add.text(0, 50, "💎 باقة سيولة (0.1 TON)", {backgroundColor: '#333', padding: 10}).setOrigin(0.5).setInteractive()
            .on('pointerdown', () => tg.showAlert("جاري الاتصال بمحفظة TON..."));

        let closeBtn = this.add.text(0, height*0.25, "[ إغلاق ]", {fill: '#f00'}).setInteractive().on('pointerdown', () => this.shopUI.setVisible(false));
        
        this.shopUI.add([bg, title, item1, item2, closeBtn]);
    }

    toggleUI(ui) {
        ui.setVisible(!ui.visible);
    }

    update() {
        // تحريك شريط الأخبار
        this.tickerText.x -= 1.5;
        if (this.tickerText.x < -this.tickerText.width) {
            this.tickerText.x = this.scale.width;
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    scene: GameScene,
    physics: { default: 'arcade' }
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
