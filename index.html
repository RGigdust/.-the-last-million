<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$LAST Empire - The Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #020617; overflow: hidden; touch-action: none; }
    </style>
</head>
<body>
<script>
const tg = window.Telegram.WebApp;
tg.expand();

class IntegratedGame extends Phaser.Scene {
    constructor() { super('IntegratedGame'); }

    create() {
        const { width, height } = this.scale;
        this.gold = 0;

        // 1. الخلفية (ميدان الكيان)
        this.add.grid(width/2, height/2, width*2, height*2, 50, 50, 0x0f172a).setAlpha(0.5);

        // 2. الأسد (القائد) مع إضافة الفيزياء
        this.player = this.add.container(width/2, height/2);
        let lionBody = this.add.circle(0, 0, 30, 0xffd700).setStrokeStyle(2, 0xffffff);
        let lionEmoji = this.add.text(0, 0, '🦁', {fontSize: '40px'}).setOrigin(0.5);
        this.player.add([lionBody, lionEmoji]);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);

        // 3. مجموعة العملات (أصول اللعبة)
        this.coins = this.physics.add.group();
        this.spawnCoin();

        // 4. واجهة المستخدم (UI)
        this.scoreText = this.add.text(20, 80, 'Gold: 0', {fontSize: '20px', fill: '#ffd700', fontWeight: 'bold'});
        this.createTopNav();
        this.createNewsTicker();
        
        // النوافذ (البورصة والمتجر)
        this.tradingWin = this.createWindow("📊 بورصة العملات الحية", 0x4ade80);
        this.shopWin = this.createWindow("🛒 متجر السيادة", 0xfbbf24);

        // تصادم الأسد مع العملات
        this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);
    }

    spawnCoin() {
        const x = Phaser.Math.Between(50, this.scale.width - 50);
        const y = Phaser.Math.Between(150, this.scale.height - 100);
        let coin = this.add.text(x, y, '💰', {fontSize: '24px'});
        this.coins.add(coin);
    }

    collectCoin(player, coin) {
        coin.destroy();
        this.gold += 10;
        this.scoreText.setText('Gold: ' + this.gold);
        this.spawnCoin(); // تظهر عملة جديدة
    }

    createTopNav() {
        const width = this.scale.width;
        let nav = this.add.rectangle(width/2, 40, width, 80, 0x000000, 0.7).setDepth(100);
        let btn1 = this.add.text(60, 40, 'البورصة', {fill: '#4ade80', backgroundColor: '#1e293b', padding: 8}).setInteractive().setDepth(101);
        let btn2 = this.add.text(180, 40, 'المتجر', {fill: '#fbbf24', backgroundColor: '#1e293b', padding: 8}).setInteractive().setDepth(101);
        
        btn1.on('pointerdown', () => { this.tradingWin.setVisible(true); this.shopWin.setVisible(false); });
        btn2.on('pointerdown', () => { this.shopWin.setVisible(true); this.tradingWin.setVisible(false); });
    }

    createWindow(title, color) {
        const { width, height } = this.scale;
        let win = this.add.container(width/2, height/2).setVisible(false).setDepth(200);
        let bg = this.add.rectangle(0, 0, width*0.85, height*0.6, 0x020617, 0.95).setStrokeStyle(2, color);
        let t = this.add.text(0, -height*0.25, title, {fontSize: '22px', fill: color}).setOrigin(0.5);
        let close = this.add.text(0, height*0.25, "[ إغلاق ]", {fill: '#f00'}).setInteractive().on('pointerdown', () => win.setVisible(false)).setOrigin(0.5);
        win.add([bg, t, close]);
        return win;
    }

    createNewsTicker() {
        this.ticker = this.add.text(this.scale.width, this.scale.height - 30, "🔥 عاجل: $LAST تسيطر على السوق ● تعلم التداول في الأكاديمية الآن ● $TON يرتفع 5%", {fill: '#4ade80'});
    }

    update() {
        // حركة الأسد باللمس
        if (this.input.activePointer.isDown) {
            this.physics.moveToObject(this.player, this.input.activePointer, 250);
        } else {
            this.player.body.setVelocity(0);
        }

        // تحريك الأخبار
        this.ticker.x -= 2;
        if (this.ticker.x < -this.ticker.width) this.ticker.x = this.scale.width;
    }
}

const config = { type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight, scene: IntegratedGame, physics: { default: 'arcade' } };
new Phaser.Game(config);
</script>
</body>
</html>
