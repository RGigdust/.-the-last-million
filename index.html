<style>
    /* ... (نفس الستايل القديم) ... */
    
    /* تعديل: الشبل لازم يكون حركته Linear عشان يستجيب بسرعة للسحب */
    #lion-player {
        position: absolute; width: 80px; height: 80px; z-index: 100;
        transition: transform 0.1s; /* نعومة في الدوران فقط */
        pointer-events: none; /* عشان الصباع ميغطيش عليه */
        will-change: left, top;
    }
    
    /* إضافة منطقة تحكم شفافة تغطي الشاشة كلها */
    #touch-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 999; touch-action: none; /* يمنع السكرول عشان اللعبة تكون سلسة */
    }
</style>

<div id="touch-layer"></div>

<script>
    // ... (إعدادات Firebase زي ما هي) ...

    const lion = document.getElementById('lion-player');
    const touchLayer = document.getElementById('touch-layer');
    
    // متغيرات الحركة
    let currentX = window.innerWidth / 2;
    let currentY = window.innerHeight / 2;
    let targetX = currentX;
    let targetY = currentY;
    let isMoving = false;

    // 1. بداية اللمس أو السحب
    touchLayer.addEventListener('touchstart', handleInput, {passive: false});
    touchLayer.addEventListener('touchmove', (e) => {
        e.preventDefault(); // منع سحب الصفحة
        handleInput(e);
    }, {passive: false});
    
    touchLayer.addEventListener('touchend', () => { isMoving = false; });

    // للكمبيوتر (الماوس)
    touchLayer.addEventListener('mousedown', (e) => { isMoving = true; handleMouse(e); });
    touchLayer.addEventListener('mousemove', (e) => { if(isMoving) handleMouse(e); });
    touchLayer.addEventListener('mouseup', () => { isMoving = false; });

    function handleInput(e) {
        isMoving = true;
        const touch = e.touches[0];
        targetX = touch.clientX - 40; // -40 عشان السنتر
        targetY = touch.clientY - 40;
    }

    function handleMouse(e) {
        targetX = e.clientX - 40;
        targetY = e.clientY - 40;
    }

    // 2. محرك اللعبة (Game Loop) - ده اللي بيعمل "نعومة الفيديو"
    function gameLoop() {
        if (!isMoving) {
            // لو مش بيتحرك، خلي الشبل يتنفس
            lion.classList.add('breathing');
        } else {
            lion.classList.remove('breathing');
            
            // معادلة "التتبع الناعم" (Lerp)
            // الشبل مش بينط للصباع، هو بيجري وراه بسرعة
            currentX += (targetX - currentX) * 0.15; 
            currentY += (targetY - currentY) * 0.15;

            lion.style.left = currentX + 'px';
            lion.style.top = currentY + 'px';
            
            // دوران الشبل ناحية الحركة (اختياري لواقعية أكتر)
            const diffX = targetX - currentX;
            if(diffX > 5) lion.style.transform = "scaleX(-1)"; // وش لليمين
            else if(diffX < -5) lion.style.transform = "scaleX(1)"; // وش لليسار
        }
        
        requestAnimationFrame(gameLoop);
    }

    // تشغيل المحرك
    gameLoop();

    // ... (باقي كود الـ Gems والـ Firebase) ...
</script>
